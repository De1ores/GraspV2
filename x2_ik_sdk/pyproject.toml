[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "x2-ik-sdk"
version = "0.1.0"
description = "AgiBot X2 upper-arm Pinocchio IK baseline SDK"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pin",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
x2_ik_sdk = ["resources/*.urdf"]
